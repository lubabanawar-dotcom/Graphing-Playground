
<!DOCTYPE html>
<html>
<head>

  <title>Graph Playground</title>

  <link rel="stylesheet" href="style.css">

  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/jsxgraph/distrib/jsxgraph.css" />

  <script
  src="https://cdn.jsdelivr.net/npm/jsxgraph/distrib/jsxgraphcore.js">
  </script>

</head>
<body>

  <h1>Graph Playground</h1>

  <input type="text" id="equationInput" placeholder="Enter equation">

  <button id="graphButton">
    Graph
  </button>

  <button id="clearButton">
    Clear
  </button>

  <p id="outputText"></p>
  
  <div id="box"></div>

  <script src="script.js"></script>

</body>
</html>
